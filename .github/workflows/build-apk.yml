name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # यह स्टेप Android SDK इंस्टॉल करेगा
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip python3-pip \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev \
            automake libltdl-dev

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36 virtualenv

      # यह स्टेप सारे लाइसेंस अपने आप एक्सेप्ट कर लेगा
      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses

      - name: Clear previous build cache
        run: |
          rm -rf .buildozer

      # बिल्ड शुरू करें
      - name: Build APK
        run: |
          yes | buildozer android debug
        env:
          ANDROIDAPI: 31
          ANDROIDMINAPI: 24

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Design-Studio-APK
          path: bin/*.apk
          retention-days: 30
