name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # यहाँ setup-android के साथ accept-android-sdk-licenses: true भेजा गया है
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip python3-pip \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev \
            automake libltdl-dev

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36 virtualenv

      # यह स्टेप जबरदस्ती लाइसेंस फाइलें बना देगा, ताकि buildozer को कोई दिक्कत न हो
      - name: Force Accept Android SDK Licenses
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          mkdir -p $ANDROID_HOME/licenses
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          echo -e "\n8933bad161af4b6a5b573652ffc7aaf3aee85a47" > $ANDROID_HOME/licenses/android-sdk-license
          echo -e "\nd56f5187479451eabf01fb78af6dfcb131b33910" > $ANDROID_HOME/licenses/android-sdk-preview-license
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/google-tv-preview-license

      - name: Clear previous build cache
        run: |
          rm -rf .buildozer

      # बिल्ड शुरू करें, साथ में 'yes' पाइप करें ताकि कोई भी प्रॉम्प्ट आए तो अपने आप 'y' चला जाए
      - name: Build APK
        run: |
          yes | buildozer android debug
        env:
          ANDROIDAPI: 31
          ANDROIDMINAPI: 24

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Design-Studio-APK
          path: bin/*.apk
          retention-days: 30
